<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeerChat Example</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- ─── Top Bar ─── -->
  <header class="topbar">
    <h1>🔗 PeerChat <span class="badge">Demo</span></h1>
    <div class="peer-info">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Connecting…</span>
      <code id="myPeerId">—</code>
      <button id="copyIdBtn" class="btn btn-ghost" title="Copy ID">📋</button>
    </div>
  </header>

  <main class="app">
    <!-- ─── Left: Connect + Chat ─── -->
    <section class="panel chat-panel">
      <div class="connect-bar">
        <input id="remoteIdInput" type="text" placeholder="Enter remote Peer ID…" />
        <button id="connectBtn" class="btn btn-primary">Connect</button>
      </div>

      <div id="chatMessages" class="chat-messages">
        <p class="empty-state">Connect to a peer to start chatting</p>
      </div>

      <form id="chatForm" class="chat-input">
        <input id="msgInput" type="text" placeholder="Type a message…" disabled />
        <button type="submit" class="btn btn-primary" id="sendBtn" disabled>Send</button>
      </form>
    </section>

    <!-- ─── Right: Video ─── -->
    <section class="panel video-panel">
      <div class="video-grid">
        <div class="video-box">
          <video id="localVideo" autoplay muted playsinline></video>
          <span class="video-label">You</span>
        </div>
        <div class="video-box">
          <video id="remoteVideo" autoplay playsinline></video>
          <span class="video-label">Remote</span>
        </div>
      </div>

      <div class="call-controls">
        <button id="callBtn" class="btn btn-accent" disabled>📞 Call</button>
        <button id="muteBtn" class="btn btn-ghost" disabled>🎤 Mute</button>
        <button id="camBtn" class="btn btn-ghost" disabled>📷 Cam Off</button>
        <button id="hangupBtn" class="btn btn-danger" disabled>🔴 Hang Up</button>
      </div>

      <div id="callStatus" class="call-status"></div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
